  /api/settings/contacts:
    get:
      tags: [Settings]
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: Search query for autocomplete
        - in: query
          name: limit
          schema: { type: integer, default: 10 }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  contacts: { type: array, items: { $ref: '#/components/schemas/Contact' } }
