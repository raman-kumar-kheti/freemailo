info:
  title: MailHive API
  description: 'Self-hosted mail and administration API. Browser sessions use HttpOnly
    cookies; cookie-authenticated mutations require X-Requested-With: MailHive.'
  version: 1.0.0
  contact: {}
tags:
- name: Auth
  description: ''
- name: Admin
  description: ''
- name: Mail
  description: ''
- name: Settings
  description: ''
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
    cookie:
      type: apiKey
      in: cookie
      name: access_token
  schemas:
    LoginDto:
      type: object
      properties:
        email:
          type: string
          example: alice@example.test
          description: User or Admin email
        password:
          type: string
          example: alice123456
          description: User or Admin password
      required:
      - email
      - password
    CreateDomainDto:
      type: object
      properties:
        name:
          type: string
          example: newdomain.test
          description: Fully qualified domain name
      required:
      - name
    CreateMailboxDto:
      type: object
      properties:
        localPart:
          type: string
          example: john
          description: Local part before @
        domainId:
          type: string
          example: cuid_here
          description: Domain ID
        password:
          type: string
          example: Password123!
          description: Mailbox initial password
        displayName:
          type: string
          example: John Doe
          description: Display name
        quotaBytes:
          type: number
          example: 1073741824
          description: Quota in bytes (default 1GB)
      required:
      - localPart
      - domainId
      - password
    UpdateMailboxDto:
      type: object
      properties:
        displayName:
          type: string
          example: Johnathan Doe
        password:
          type: string
          example: NewSecret123!
        quotaBytes:
          type: number
          example: 2147483648
        isActive:
          type: boolean
          example: true
    CreateAliasDto:
      type: object
      properties:
        sourceAddress:
          type: string
          example: support@example.test
          description: Source alias address
        destinationMailboxId:
          type: string
          example: cuid_mailbox_id
          description: Destination mailbox ID
      required:
      - sourceAddress
      - destinationMailboxId
    DeleteMessagesDto:
      type: object
      properties:
        folder:
          type: string
          description: Folder name
          example: INBOX
        uids:
          description: Array of message UIDs
          type: array
          items:
            type: number
        permanent:
          type: boolean
          description: Permanently delete messages instead of moving to Trash
          default: false
      required:
      - folder
      - uids
    SendMailDto:
      type: object
      properties:
        to:
          description: Array of recipient email addresses
          type: array
          items:
            type: string
        cc:
          description: Array of CC email addresses
          type: array
          items:
            type: string
        bcc:
          description: Array of BCC email addresses
          type: array
          items:
            type: string
        subject:
          type: string
          description: Subject line
        htmlBody:
          type: string
          description: HTML body content
        textBody:
          type: string
          description: Plain text body content
        inReplyTo:
          type: string
          description: In-Reply-To Message-ID for replies
        references:
          description: References array for threading
          type: array
          items:
            type: string
