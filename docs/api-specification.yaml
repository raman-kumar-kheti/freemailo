            application/json:
              schema:
                type: object
                properties:
                  labels: { type: array, items: { $ref: '#/components/schemas/Label' } }
    post:
      tags: [Settings]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                color: { type: string }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Label' }

  /api/settings/labels/{id}:
    put:
      tags: [Settings]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                color: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Label' }
    delete:
      tags: [Settings]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204': { description: Label deleted }

  /api/settings/vacation:
    get:
      tags: [Settings]
      responses:
        '200':
