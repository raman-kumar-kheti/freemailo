# Mail storage configuration
mail_location = maildir:/var/vmail/%d/%n/Maildir
mail_uid = 5000
mail_gid = 5000
mail_privileged_group = vmail
first_valid_uid = 5000
last_valid_uid = 5000

mail_plugins = $mail_plugins quota

# Imported/restored Maildirs can carry stale S= values. Stat the file instead of
# disconnecting IMAP sessions when its declared size differs from its bytes.
maildir_broken_filename_sizes = yes
