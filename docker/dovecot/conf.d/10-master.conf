# Service configuration

service imap-login {
  inet_listener imap {
    port = 0
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

service imap {
  # Max processes per user
  process_limit = 256
}

service lmtp {
  inet_listener lmtp {
    address = *
    port = 24
  }
}

service auth {
  # Postfix SASL authentication
  inet_listener {
    address = *
    port = 12345
  }

  # Auth worker socket
  unix_listener auth-userdb {
    mode = 0660
    user = vmail
    group = vmail
  }
}

service auth-worker {
  user = vmail
}

service managesieve-login {
  inet_listener sieve {
    port = 4190
  }
}

service managesieve {
}
