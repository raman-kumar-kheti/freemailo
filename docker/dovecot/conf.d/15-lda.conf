# LDA configuration
protocol lda {
  mail_plugins = $mail_plugins sieve
}

postmaster_address = postmaster@MAIL_DOMAIN_PLACEHOLDER
hostname = MAIL_HOSTNAME_PLACEHOLDER
lda_mailbox_autocreate = yes
lda_mailbox_autosubscribe = yes

# Sieve-generated mail uses a private, certificate-authorized SMTP listener.
# No password or unrestricted Docker-network relay is needed.
submission_host = MAIL_HOSTNAME_PLACEHOLDER:2525
submission_ssl = smtps
submission_timeout = 30 secs
ssl_client_cert = </etc/ssl/mail/mail.crt
ssl_client_key = </etc/ssl/mail/mail.key
ssl_client_ca_file = /etc/ssl/mail/mail.crt
ssl_client_ca_dir = /etc/ssl/certs
ssl_client_require_valid_cert = yes
