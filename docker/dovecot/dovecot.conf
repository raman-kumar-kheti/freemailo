# =============================================================================
# FreeMailo – Dovecot main config
# =============================================================================

protocols = imap lmtp sieve
listen = *

# Include configuration
!include conf.d/10-auth.conf
!include conf.d/10-mail.conf
!include conf.d/10-master.conf
!include conf.d/10-ssl.conf
!include conf.d/15-lda.conf
!include conf.d/15-mailboxes.conf
!include conf.d/20-imap.conf
!include conf.d/20-lmtp.conf
!include conf.d/20-managesieve.conf
!include conf.d/90-plugin.conf
!include conf.d/90-sieve.conf

# Logging
log_path = /dev/stderr
info_log_path = /dev/stdout
debug_log_path = /dev/stderr
auth_verbose = yes
mail_debug = no
