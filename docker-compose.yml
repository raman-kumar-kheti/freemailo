###############################################################################
# MailHive – Production Docker Compose
# Usage:  docker compose up -d
# Dev:    docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
###############################################################################

services:
  migrate:
    profiles: [tools]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: builder
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: ["npx", "prisma", "migrate", "deploy", "--schema", "prisma/schema.prisma"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [appnet]

  # ---------------------------------------------------------------------------
  # PostgreSQL – primary datastore (accounts, domains, aliases)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: mailhive-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - appnet

  # ---------------------------------------------------------------------------
  # Redis – caching, rate-limiting, Rspamd backend
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: mailhive-redis
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD}
        --appendonly yes
        --maxmemory 256mb
        --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - appnet
      - mailnet

  # ---------------------------------------------------------------------------
  # Postfix – MTA (SMTP inbound & outbound)
  # ---------------------------------------------------------------------------
  postfix:
    build:
      context: ./docker/postfix
    container_name: mailhive-postfix
    healthcheck:
      test: ["CMD-SHELL", "postfix status"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME}
      MAIL_DOMAIN: ${MAIL_DOMAIN}
      DOVECOT_MASTER_USER: ${DOVECOT_MASTER_USER:-mailhive_master}
      DOVECOT_MASTER_PASSWORD: ${DOVECOT_MASTER_PASSWORD:?Set DOVECOT_MASTER_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - postfixqueue:/var/spool/postfix
      - vmail:/var/vmail
      - ./certs:/etc/ssl/mail:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mailnet
      - appnet

  # ---------------------------------------------------------------------------
  # Dovecot – IMAP / LMTP / ManageSieve
  # ---------------------------------------------------------------------------
  dovecot:
    build:
      context: ./docker/dovecot
    container_name: mailhive-dovecot
    healthcheck:
      test: ["CMD", "doveadm", "service", "status"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - "993:993"
      - "4190:4190"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME}
      MAIL_DOMAIN: ${MAIL_DOMAIN}
      DOVECOT_MASTER_USER: ${DOVECOT_MASTER_USER:-mailhive_master}
      DOVECOT_MASTER_PASSWORD: ${DOVECOT_MASTER_PASSWORD:?Set DOVECOT_MASTER_PASSWORD}
    volumes:
      - vmail:/var/vmail
      - ./certs:/etc/ssl/mail:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mailnet
      - appnet

  # ---------------------------------------------------------------------------
  # Rspamd – spam filtering, DKIM signing, antivirus
  # ---------------------------------------------------------------------------
  rspamd:
    build:
      context: ./docker/rspamd
    container_name: mailhive-rspamd
    ports:
      - "127.0.0.1:11334:11334"          # Web UI only; milter (11332) stays internal
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RSPAMD_PASSWORD: ${RSPAMD_PASSWORD}
    volumes:
      - rspamddata:/var/lib/rspamd
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mailnet

  # ---------------------------------------------------------------------------
  # API – NestJS Backend API & Provisioning Worker
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mailhive-api
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      APP_URL: ${APP_URL:-http://localhost:3000}
      MAIL_TLS_SERVERNAME: ${MAIL_HOSTNAME}
      MAIL_TLS_REJECT_UNAUTHORIZED: ${MAIL_TLS_REJECT_UNAUTHORIZED:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-7d}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME}
      MAIL_DOMAIN: ${MAIL_DOMAIN}
      POSTFIX_HOST: postfix
      DOVECOT_HOST: dovecot
      DOVECOT_MASTER_USER: ${DOVECOT_MASTER_USER:-mailhive_master}
      DOVECOT_MASTER_PASSWORD: ${DOVECOT_MASTER_PASSWORD:?Set DOVECOT_MASTER_PASSWORD}
    volumes:
      - vmail:/var/vmail
      - rspamddata:/var/lib/rspamd
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rspamd:
        condition: service_started
    restart: unless-stopped
    networks:
      - appnet
      - mailnet
      - frontend

  # ---------------------------------------------------------------------------
  # Web – Next.js Gmail-style Webmail UI
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: mailhive-web
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      API_URL: http://api:4000
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - frontend
      - appnet

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postfixqueue:
    driver: local
  pgdata:
    driver: local
  redisdata:
    driver: local
  vmail:
    driver: local
  rspamddata:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  appnet:
    driver: bridge
  mailnet:
    driver: bridge
  frontend:
    driver: bridge
