###############################################################################
# MailHive – Production Docker Compose
# Usage:  docker compose up -d
# Dev:    docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
###############################################################################

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL – primary datastore (accounts, domains, aliases)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: mailhive-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - appnet

  # ---------------------------------------------------------------------------
  # Redis – caching, rate-limiting, Rspamd backend
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: mailhive-redis
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD}
        --appendonly yes
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - appnet
      - mailnet

  # ---------------------------------------------------------------------------
  # Postfix – MTA (SMTP inbound & outbound)
  # ---------------------------------------------------------------------------
  postfix:
    build:
      context: ./docker/postfix
    container_name: mailhive-postfix
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME}
      MAIL_DOMAIN: ${MAIL_DOMAIN}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - vmail:/var/vmail
      - ./certs:/etc/ssl/mail:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mailnet
      - appnet

  # ---------------------------------------------------------------------------
  # Dovecot – IMAP / LMTP / ManageSieve
  # ---------------------------------------------------------------------------
  dovecot:
    build:
      context: ./docker/dovecot
    container_name: mailhive-dovecot
    ports:
      - "993:993"
      - "4190:4190"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME}
      MAIL_DOMAIN: ${MAIL_DOMAIN}
    volumes:
      - vmail:/var/vmail
      - ./certs:/etc/ssl/mail:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mailnet
      - appnet

  # ---------------------------------------------------------------------------
  # Rspamd – spam filtering, DKIM signing, antivirus
  # ---------------------------------------------------------------------------
  rspamd:
    build:
      context: ./docker/rspamd
    container_name: mailhive-rspamd
    ports:
      - "11334:11334"          # Web UI only; milter (11332) stays internal
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RSPAMD_PASSWORD: ${RSPAMD_PASSWORD}
    volumes:
      - rspamddata:/var/lib/rspamd
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mailnet

  # ---------------------------------------------------------------------------
  # Roundcube – webmail client
  # ---------------------------------------------------------------------------
  roundcube:
    image: roundcube/roundcubemail:latest
    container_name: mailhive-roundcube
    ports:
      - "8080:80"
    environment:
      ROUNDCUBEMAIL_DEFAULT_HOST: ssl://dovecot
      ROUNDCUBEMAIL_DEFAULT_PORT: "993"
      ROUNDCUBEMAIL_SMTP_SERVER: postfix
      ROUNDCUBEMAIL_SMTP_PORT: "587"
      ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE: 25M
    volumes:
      - ./docker/roundcube/custom.inc.php:/var/roundcube/config/custom.inc.php:ro
    depends_on:
      - dovecot
      - postfix
    restart: unless-stopped
    networks:
      - mailnet
      - frontend

# =============================================================================
# Volumes
# =============================================================================
volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  vmail:
    driver: local
  rspamddata:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  appnet:
    driver: bridge
  mailnet:
    driver: bridge
  frontend:
    driver: bridge
